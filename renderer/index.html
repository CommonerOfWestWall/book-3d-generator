<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立体书样机生成器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #1a1a2e;
  --panel: #16213e;
  --card: #1f2b47;
  --accent: #4fc3f7;
  --accent2: #ff7043;
  --text: #e8eaed;
  --text-dim: #9aa0a6;
  --border: #2d3a5a;
  --success: #66bb6a;
  --warn: #ffa726;
  --danger: #ef5350;
  --radius: 10px;
}

body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
  user-select: none;
}

#left-panel {
  width: 360px;
  min-width: 320px;
  background: var(--panel);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
}

#left-panel::-webkit-scrollbar { width: 4px; }
#left-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.panel-section {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.panel-title {
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

/* 上传区 */
#upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

#upload-zone:hover, #upload-zone.dragover {
  border-color: var(--accent);
  background: rgba(79, 195, 247, 0.05);
}

#upload-zone input { display: none; }

.upload-icon {
  font-size: 36px;
  margin-bottom: 8px;
}

.upload-text {
  font-size: 14px;
  color: var(--text-dim);
}

.upload-thumb {
  max-width: 100%;
  max-height: 120px;
  margin-top: 8px;
  border-radius: 4px;
}

/* 按钮 */
.btn {
  padding: 10px 16px;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-primary {
  background: var(--accent);
  color: #000;
}

.btn-primary:hover { background: #81d4fa; }

.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-secondary:hover { background: #2a3a5a; }

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-full { width: 100%; }

/* 书脊滑块 */
.slider-group {
  margin-bottom: 16px;
}

.slider-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.slider-label span {
  font-size: 13px;
  color: var(--text-dim);
}

.slider-value {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  font-family: monospace;
  min-width: 60px;
  text-align: right;
}

input[type="range"] {
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: var(--card);
  appearance: none;
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

/* 类型选择 */
.type-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.type-btn {
  padding: 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.type-btn:hover { border-color: var(--accent); }

.type-btn.active {
  border-color: var(--accent);
  background: rgba(79, 195, 247, 0.15);
}

/* 预设角度 */
.preset-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.preset-btn {
  padding: 10px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.preset-btn:hover {
  border-color: var(--accent);
  background: rgba(79, 195, 247, 0.1);
}

.preset-btn.active {
  border-color: var(--accent);
  background: rgba(79, 195, 247, 0.2);
  color: var(--accent);
}

/* 背景选择 */
.bg-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.bg-btn {
  padding: 10px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.bg-btn:hover { border-color: var(--accent); }

.bg-btn.active {
  border-color: var(--accent);
  background: rgba(79, 195, 247, 0.15);
}

/* 导出选项 */
.export-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

select {
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
}

select:focus { outline: none; border-color: var(--accent); }

.control-row {
  display: grid;
  grid-template-columns: 1fr 72px;
  gap: 10px;
  align-items: center;
}

.num-input {
  width: 72px;
  padding: 7px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  text-align: right;
}

.num-input:focus { outline: none; border-color: var(--accent); }

/* 角度显示面板 */
.angle-display {
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 12px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  text-align: center;
}

.angle-item {
  padding: 8px;
}

.angle-item-label {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.angle-item-value {
  font-size: 18px;
  font-weight: 700;
  font-family: monospace;
  color: var(--accent);
}

/* 状态栏 */
#status-bar {
  padding: 12px 16px;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: auto;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--warn);
}

.status-dot.ready { background: var(--success); }
.status-dot.busy { background: var(--warn); animation: pulse 1s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

#status-text {
  font-size: 12px;
  color: var(--text-dim);
}

/* 主视图 */
#main-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
}

#canvas-container {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#canvas-container canvas {
  display: block;
}

/* 顶部工具栏 */
#toolbar {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

/* Toast */
#toast {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--card);
  color: var(--text);
  padding: 12px 24px;
  border-radius: var(--radius);
  font-size: 14px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  border: 1px solid var(--border);
  z-index: 100;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

#toast.success { border-color: var(--success); }
#toast.error { border-color: var(--danger); }

/* 书脊选择弹窗 */
#spine-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

#spine-modal.open { display: flex; }

.spine-modal-content {
  background: var(--panel);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 90vw;
  max-height: 90vh;
  overflow: auto;
}

.spine-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.spine-modal-title {
  font-size: 18px;
  font-weight: 600;
}

.spine-preview {
  position: relative;
  display: inline-block;
  max-width: 100%;
}

#spine-preview-img {
  max-width: 100%;
  max-height: 50vh;
  display: block;
}

#spine-line-left, #spine-line-right, #crop-line-left, #crop-line-right {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 3px;
  cursor: ew-resize;
}

#spine-line-left, #spine-line-right {
  background: #ff4444;
}

#crop-line-left, #crop-line-right {
  display: none;
  background: var(--accent);
}

#crop-line-left.active, #crop-line-right.active {
  display: block;
}

#spine-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  background: rgba(255, 68, 68, 0.2);
}

#crop-fill-left, #crop-fill-right {
  display: none;
  position: absolute;
  top: 0;
  bottom: 0;
  background: rgba(79, 195, 247, 0.18);
}

#crop-fill-left.active, #crop-fill-right.active {
  display: block;
}

.option-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
  margin: 8px 0 12px;
}

.option-row input {
  margin-top: 3px;
}

.spine-modal-footer {
  margin-top: 16px;
  display: flex;
  gap: 12px;
  justify-content: flex-end;
}
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>

<!-- 左侧面板 -->
<div id="left-panel">
  <header class="app-header"><span class="brand-mark" data-icon="BookOpen"></span><div><h1>立体书样机</h1><span class="brand-subtitle">BOOK 3D STUDIO</span></div></header>
  <nav class="workflow-tabs" aria-label="工作流程">
    <button class="step-tab active" data-step="cover" aria-pressed="true">封面</button>
    <button class="step-tab" data-step="structure" aria-pressed="false">书型</button>
    <button class="step-tab" data-step="view" aria-pressed="false">视角</button>
    <button class="step-tab" data-step="export" aria-pressed="false">导出</button>
  </nav>
  <!-- 上传 -->
  <div class="panel-section" data-step="cover">
    <div class="panel-title">封面展开图</div>
    <div id="upload-zone" role="button" tabindex="0" aria-label="导入封面展开图">
      <input type="file" id="file-input" accept="image/*">
      <div class="upload-icon" data-icon="ImagePlus"></div>
      <div class="upload-text">导入封面展开图</div>
      <div id="upload-thumb-wrap"></div>
    </div>
    <div id="image-meta">未导入图片</div>
    <button class="btn btn-secondary btn-full" id="test-btn" style="margin-top: 12px;">
      <span data-icon="FlaskConical"></span>示例封面
    </button>
  </div>

  <!-- 书脊设置 -->
  <div class="panel-section" data-step="cover" id="spine-section" style="display: none;">
    <div class="panel-title">封面裁切</div>
    <dl class="book-measurements"><div><dt>书脊边界</dt><dd id="spine-range-meta">—</dd></div><div><dt>勒口裁切</dt><dd id="crop-meta">—</dd></div></dl>
    <button class="btn btn-secondary btn-full" id="edit-crop-btn"><span data-icon="Crop"></span>重新裁切</button>
  </div>

  <!-- 书籍类型 -->
  <div class="panel-section" data-step="structure" hidden>
    <div class="panel-title">装订方式</div>
    <div class="type-grid">
      <button class="type-btn active" data-type="paperback">
        平装
      </button>
      <button class="type-btn" data-type="hardcover">
        精装
      </button>
    </div>
    <div id="type-label" style="text-align: center; margin-top: 8px; color: var(--accent); font-size: 13px;">
      平装本
    </div>
    <div id="hardcover-controls" hidden>
      <div class="slider-group"><label class="slider-label" for="board-input">封板厚度 / 封面宽度 <span id="board-val">1.2%</span></label><div class="control-row"><input id="board-slider" type="range" min="0.4" max="2.5" step="0.1" value="1.2" aria-label="封板厚度"><input id="board-input" class="num-input" type="number" min="0.4" max="2.5" step="0.1" value="1.2" aria-label="封板厚度百分比"></div></div>
      <div class="slider-group"><label class="slider-label" for="overhang-input">出飘 / 封面宽度 <span id="overhang-val">1.8%</span></label><div class="control-row"><input id="overhang-slider" type="range" min="0.5" max="4" step="0.1" value="1.8" aria-label="封板出飘"><input id="overhang-input" class="num-input" type="number" min="0.5" max="4" step="0.1" value="1.8" aria-label="封板出飘百分比"></div></div>
    </div>
    <dl class="book-measurements"><div><dt>封面宽高比</dt><dd id="aspect-meta">—</dd></div><div><dt>书厚 / 封面宽度</dt><dd id="depth-meta">—</dd></div><div id="board-effective-row" hidden><dt>实际封板厚度</dt><dd id="board-effective">—</dd></div></dl>
  </div>

  <!-- 角度显示 -->
  <div class="panel-section" data-step="view" hidden>
    <div class="panel-title">旋转与镜头</div>
    <div class="angle-display">
      <div class="angle-item">
        <div class="angle-item-label">X轴旋转</div>
        <div class="angle-item-value" id="az-display">0°</div>
      </div>
      <div class="angle-item">
        <div class="angle-item-label">Y轴旋转</div>
        <div class="angle-item-value" id="el-display">35°</div>
      </div>
      <div class="angle-item">
        <div class="angle-item-label">Z轴旋转</div>
        <div class="angle-item-value" id="rotZ-display">0°</div>
      </div>
    </div>

    <!-- 手动滑块 -->
    <div class="slider-group">
      <div class="slider-label">
        <span>X轴旋转 (-180° ~ 180°)</span>
        <span class="slider-value" id="az-val">0°</span>
      </div>
      <div class="control-row">
        <input type="range" id="az-slider" min="-180" max="180" value="0" step="1">
        <input type="number" class="num-input" id="az-input" min="-180" max="180" value="0" step="1">
      </div>
    </div>
    <div class="slider-group">
      <div class="slider-label">
        <span>Y轴旋转 (-180° ~ 180°)</span>
        <span class="slider-value" id="el-val">35°</span>
      </div>
      <div class="control-row">
        <input type="range" id="el-slider" min="-180" max="180" value="35" step="1">
        <input type="number" class="num-input" id="el-input" min="-180" max="180" value="35" step="1">
      </div>
    </div>
    <div class="slider-group">
      <div class="slider-label">
        <span>Z轴旋转 (-180° ~ 180°)</span>
        <span class="slider-value" id="rotZ-val">0°</span>
      </div>
      <div class="control-row">
        <input type="range" id="rotZ-slider" min="-180" max="180" value="0" step="1">
        <input type="number" class="num-input" id="rotZ-input" min="-180" max="180" value="0" step="1">
      </div>
    </div>
    <div class="slider-group">
      <div class="slider-label">
        <span>镜头距离</span>
        <span class="slider-value" id="zoom-val">11.5</span>
      </div>
      <div class="control-row">
        <input type="range" id="zoom-slider" min="8" max="24" value="11.5" step="0.5">
        <input type="number" class="num-input" id="zoom-input" min="8" max="24" value="11.5" step="0.5">
      </div>
    </div>
    <div class="slider-group">
      <div class="slider-label">
        <span>镜头高度</span>
        <span class="slider-value" id="height-val">0</span>
      </div>
      <div class="control-row">
        <input type="range" id="height-slider" min="-6" max="6" value="0" step="0.25">
        <input type="number" class="num-input" id="height-input" min="-6" max="6" value="0" step="0.25">
      </div>
    </div>
  </div>

  <!-- 预设角度 -->
  <div class="panel-section" data-step="view" hidden>
    <div class="panel-title">预设视角</div>
    <div class="preset-grid">
      <button class="preset-btn" data-id="front" data-az="0" data-el="0" data-z="0" data-zoom="11.5" data-height="0">封面正视</button>
      <button class="preset-btn active" data-id="front-spine" data-az="0" data-el="25" data-z="0" data-zoom="11.5" data-height="0">封面微侧</button>
      <button class="preset-btn" data-id="front-edge" data-az="0" data-el="-25" data-z="0" data-zoom="11.5" data-height="0">书口微侧</button>
      <button class="preset-btn" data-id="back" data-az="0" data-el="180" data-z="0" data-zoom="11.5" data-height="0">封底正视</button>
      <button class="preset-btn" data-id="back-spine" data-az="0" data-el="155" data-z="0" data-zoom="11.5" data-height="0">封底微侧</button>
      <button class="preset-btn" data-id="oblique" data-az="-48" data-el="-20" data-z="-20" data-zoom="12" data-height="0">斜俯展示</button>
    </div>
  </div>

  <div class="panel-section" data-step="view" hidden>
    <div class="panel-title">我的视角</div>
    <form id="view-save-form" class="view-save-form">
      <label for="view-name">视角名称</label>
      <div class="view-save-row">
        <input id="view-name" type="text" placeholder="未命名视角" autocomplete="off">
        <button type="submit" class="btn btn-primary icon-btn" id="save-view-btn" title="保存当前视角" aria-label="保存当前视角"><span data-icon="Save"></span></button>
        <button type="button" class="btn btn-secondary icon-btn" id="cancel-view-edit" hidden title="取消重命名" aria-label="取消重命名"><span data-icon="X"></span></button>
      </div>
    </form>
    <div id="view-storage-error" role="alert" hidden></div>
    <div id="saved-view-list"></div>
  </div>

  <!-- 背景 -->
  <div class="panel-section" data-step="export" hidden>
    <div class="panel-title">背景</div>
    <div class="bg-grid">
      <button class="bg-btn active" data-bg="transparent">透明</button>
      <button class="bg-btn" data-bg="white">白色</button>
    </div>
  </div>

  <!-- 导出 -->
  <div class="panel-section" data-step="export" hidden>
    <div class="panel-title">导出图片</div>
    <div class="export-grid">
      <select id="export-format">
        <option value="png">PNG</option>
        <option value="jpg">JPG (白色背景)</option>
      </select>
      <select id="export-size">
        <option value="1024">1024px</option>
        <option value="1920" selected>1920px</option>
        <option value="2560">2560px</option>
      </select>
    </div>
    <button class="btn btn-primary btn-full" id="export-single-btn" disabled>
      <span data-icon="Download"></span>导出当前角度
    </button>
    <div class="panel-title batch-title">批量视角 <span id="batch-count">4</span></div>
    <div class="batch-modes" role="group" aria-label="批量视角组合">
      <button class="btn btn-secondary" type="button" data-batch="common">常用四张</button>
      <button class="btn btn-secondary" type="button" data-batch="recommended">推荐六张</button>
      <button class="btn btn-secondary" type="button" data-batch="custom">我的视角</button>
    </div>
    <div id="batch-view-list"></div>
    <button class="btn btn-secondary btn-full" id="export-all-btn" disabled style="margin-top: 8px;">
      <span data-icon="Files"></span><span id="batch-export-label">导出选中视角（4）</span>
    </button>
  </div>

  <!-- 状态栏 -->
  <div id="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text" role="status">等待封面</span>
  </div>
</div>

<!-- 主视图 -->
<div id="main-view">
  <div class="preview-header"><span id="preview-title">平装 · 未导入封面</span><span class="preview-badge">1 : 1</span></div>
  <div id="canvas-container"></div>
  <div id="toolbar">
    <button class="btn btn-secondary icon-btn" id="reset-btn" title="重置视角" aria-label="重置视角"><span data-icon="RotateCcw"></span></button>
    <button class="btn btn-secondary icon-btn" id="fit-btn" title="适配画面" aria-label="适配画面"><span data-icon="Maximize"></span></button>

<script>
// ══════════════════════════════════════════════════════════════
// 状态
// ══════════════════════════════════════════════════════════════
let coverData = null;
let fullImageData = null;
let images = { cover: null, spine: null, back: null };
let bookType = 'paperback';
let bgType = 'transparent';
let rotX = 0, rotY = 25, rotZ = 0, cameraDistance = 11.5, cameraHeight = 0;
let spineLeft = 44, spineRight = 56;
let flapCropEnabled = false;
let cropLeft = 0, cropRight = 100;
let isRendering = false;
let loadedPreset = false;
const viewStorageKey = 'book3d.camera-presets.v1';
let savedViews = [], selectedViewIds = [], renamingViewId = null;
let viewStorageBlocked = false;
let bookSize = { w: 4.0, h: 5.66, d: 0.52 };
let coverEdgeColor = 0x22201b;
let hingeColor = 0x34302b;
let hardcoverOptions = { boardPercent: 1.2, overhangPercent: 1.8 };
let textureLoads = [];
let renderRevision = 0;
let exportBusy = false;
let exportDisabledStates = new Map();
let cropSnapshot = null;
let pendingImageData = null;
let imageName = '', pendingImageName = '';
let focusBeforeCrop = null;
let fileRevision = 0;

let scene, camera, renderer, bookGroup;
let canvas, canvasWidth, canvasHeight;

// Three.js 全局
let THREE;

const book3dBridge = {
  async saveFileDialog(defaultName, fmt) {
    if (window.electronAPI?.saveFileDialog) {
      return window.electronAPI.saveFileDialog(defaultName);
    }
    if (window.__TAURI__?.dialog?.save) {
      const extension = fmt === 'jpg' ? 'jpg' : 'png';
      const filePath = await window.__TAURI__.dialog.save({
        defaultPath: defaultName,
        filters: [{ name: extension.toUpperCase() + ' 图片', extensions: [extension] }]
      });
      return filePath ? { canceled: false, filePath } : { canceled: true };
    }
    return { canceled: true };
  },

  async selectOutputFolder() {
    if (window.electronAPI?.selectOutputFolder) {
      return window.electronAPI.selectOutputFolder();
    }
    if (window.__TAURI__?.dialog?.open) {
      const filePath = await window.__TAURI__.dialog.open({
        directory: true,
        multiple: false
      });
      return filePath ? { canceled: false, filePaths: [filePath] } : { canceled: true, filePaths: [] };
    }
    return { canceled: true, filePaths: [] };
  },

  async saveImageFile(filePath, base64Data) {
    if (window.electronAPI?.saveImageFile) {
      return window.electronAPI.saveImageFile(filePath, base64Data);
    }
    if (window.__TAURI__?.core?.invoke) {
      await window.__TAURI__.core.invoke('save_image_file', {
        filePath,
        base64Data
      });
      return true;
    }
    return false;
  }
};

// ══════════════════════════════════════════════════════════════
// Three.js 初始化 (无光照版本)
// ══════════════════════════════════════════════════════════════
function initThree() {
  THREE = window.THREE;

  const container = document.getElementById('canvas-container');
  canvasWidth = container.clientWidth;
  canvasHeight = container.clientHeight;

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(35, canvasWidth / canvasHeight, 0.1, 1000);

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: bgType !== 'white',
    preserveDrawingBuffer: true
  });
  renderer.setSize(canvasWidth, canvasHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  container.appendChild(renderer.domElement);

  // 无光照！使用 MeshBasicMaterial 保持颜色准确性
  // 环境光设置（最小）仅用于辅助
  scene.add(new THREE.AmbientLight(0xffffff, 0.01));

  // 初始视角
  updateCamera();

  // 初始渲染一本书（默认蓝色）
  buildBook();

  // 鼠标拖拽
  setupMouseControls();

  // 窗口大小变化
  window.addEventListener('resize', onResize);
  new ResizeObserver(onResize).observe(container);
}

function onResize() {
  const container = document.getElementById('canvas-container');
  canvasWidth = container.clientWidth;
  canvasHeight = container.clientHeight;
  camera.aspect = canvasWidth / canvasHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(canvasWidth, canvasHeight);
  renderer.render(scene, camera);
}

function updateCamera() {
  const r = cameraDistance;
  camera.position.set(0, cameraHeight, r);
  camera.lookAt(0, 0, 0);
  if (bookGroup) {
    bookGroup.rotation.set(
      THREE.MathUtils.degToRad(rotX),
      THREE.MathUtils.degToRad(rotY),
      THREE.MathUtils.degToRad(rotZ)
    );
  }

  renderer.render(scene, camera);

  // 更新显示
  updateAngleDisplay();
}

// ══════════════════════════════════════════════════════════════
// 材质工厂 (无光照 MeshBasicMaterial)
// ══════════════════════════════════════════════════════════════
function makeFlatMat(color) {
  return new THREE.MeshBasicMaterial({ color: new THREE.Color(color).convertSRGBToLinear() });
}

function makeFaceMaterials(faceIndex, faceMat, edgeMat) {
  return [0, 1, 2, 3, 4, 5].map(i => i === faceIndex ? faceMat : edgeMat);
}

function configureImageTexture(tex, preserveDetail = false) {
  tex.encoding = THREE.sRGBEncoding;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.magFilter = THREE.LinearFilter;
  if (preserveDetail) {
    tex.minFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
  }
  const maxAnisotropy = renderer?.capabilities?.getMaxAnisotropy?.() || 1;
  tex.anisotropy = Math.min(16, maxAnisotropy);
}

function makeTexMat(dataURL, options = {}) {
  const tex = new THREE.Texture();
  const img = new Image();
  const revision = renderRevision;
  const ready = new Promise((resolve, reject) => {
    img.onload = () => {
      if (revision === renderRevision) {
        tex.image = img;
        configureImageTexture(tex, !!options.preserveDetail);
        tex.needsUpdate = true;
        renderer.render(scene, camera);
      }
      resolve();
    };
    img.onerror = () => reject(new Error('封面贴图加载失败'));
  });
  ready.catch(() => {});
  textureLoads.push(ready);
  img.src = dataURL;
  configureImageTexture(tex, !!options.preserveDetail);
  return new THREE.MeshBasicMaterial({ map: tex });
}

function makeDoubleTexMat(dataURL, options = {}) {
  const mat = makeTexMat(dataURL, options);
  mat.side = THREE.DoubleSide;
  return mat;
}

function makeDoublePageMat(tex) {
  return new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
}

function makeTransparentMat(color, opacity = 0.18) {
  return new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
}

function rgbToHex(r, g, b) {
  return (r << 16) | (g << 8) | b;
}

function darkenHex(hex, factor = 0.72) {
  const r = Math.max(0, Math.min(255, Math.round(((hex >> 16) & 255) * factor)));
  const g = Math.max(0, Math.min(255, Math.round(((hex >> 8) & 255) * factor)));
  const b = Math.max(0, Math.min(255, Math.round((hex & 255) * factor)));
  return rgbToHex(r, g, b);
}

function sampleRegionEdgeColor(x, y, width, height, img = document.getElementById('spine-preview-img')) {
  const c = document.createElement('canvas');
  c.width = width; c.height = height;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, x, y, width, height, 0, 0, width, height);
  const data = ctx.getImageData(0, 0, width, height).data;
  const step = Math.max(1, Math.floor(Math.min(width, height) / 80));
  let r = 0, g = 0, b = 0, n = 0;
  function add(px, py) {
    const i = (py * width + px) * 4;
    const a = data[i + 3];
    if (a < 20) return;
    r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
  }
  for (let px = 0; px < width; px += step) {
    add(px, 0);
    add(px, height - 1);
  }
  for (let py = 0; py < height; py += step) {
    add(0, py);
    add(width - 1, py);
  }
  if (!n) return 0x22201b;
  return rgbToHex(Math.round(r / n), Math.round(g / n), Math.round(b / n));
}

// ══════════════════════════════════════════════════════════════
// 书页纹理 (竖线/横线)
// ══════════════════════════════════════════════════════════════
function makePageTex(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f8f4e8';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#e0d8c8';
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 2) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  configureImageTexture(tex);
  return tex;
}

function makePageTexH(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f8f4e8';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#e0d8c8';
  ctx.lineWidth = 1;
  for (let y = 0; y < h; y += 2) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  configureImageTexture(tex);
  return tex;
}

// ══════════════════════════════════════════════════════════════
// 平装本书芯
// ══════════════════════════════════════════════════════════════
function addPaperbackCore(group, W, H, D) {
  const pageBlockW = D * 0.88;

  // 前封面
  const frontMat = images.cover ? makeDoubleTexMat(images.cover) : makeFlatMat(0x3a8fc7);
  const frontGeo = new THREE.PlaneGeometry(W, H);
  const frontMesh = new THREE.Mesh(frontGeo, frontMat);
  frontMesh.position.set(0, 0, pageBlockW / 2);
  group.add(frontMesh);

  // 后封面
  const backMat = images.back ? makeDoubleTexMat(images.back) : makeFlatMat(0x607d8b);
  const backGeo = new THREE.PlaneGeometry(W, H);
  const backMesh = new THREE.Mesh(backGeo, backMat);
  backMesh.position.set(0, 0, -pageBlockW / 2);
  backMesh.rotation.y = Math.PI;
  group.add(backMesh);

  // 书脊
  if (images.spine) {
    const spineMat = makeDoubleTexMat(images.spine, { preserveDetail: true });
    const spineGeo = new THREE.PlaneGeometry(pageBlockW, H);
    const spineMesh = new THREE.Mesh(spineGeo, spineMat);
    spineMesh.position.set(-W / 2, 0, 0);
    spineMesh.rotation.y = -Math.PI / 2;
    group.add(spineMesh);
  }

  // 书口（竖线纹理）
  const edgeTex = makePageTex(Math.max(8, Math.floor(D * 60)), Math.max(8, Math.floor(H * 30)));
  const edgeMat = makeDoublePageMat(edgeTex);
  const edgeGeo = new THREE.PlaneGeometry(pageBlockW, H);
  const edgeMesh = new THREE.Mesh(edgeGeo, edgeMat);
  edgeMesh.position.set(W / 2, 0, 0);
  edgeMesh.rotation.y = -Math.PI / 2;
  group.add(edgeMesh);

  // 书顶（横线纹理）
  const topTex = makePageTexH(Math.max(8, Math.floor(W * 30)), Math.max(8, Math.floor(D * 30)));
  const topMat = makeDoublePageMat(topTex);
  const topGeo = new THREE.PlaneGeometry(W, pageBlockW);
  const topMesh = new THREE.Mesh(topGeo, topMat);
  topMesh.position.set(0, H / 2, 0);
  topMesh.rotation.x = -Math.PI / 2;
  group.add(topMesh);

  // 书底
  const botTex = makePageTexH(Math.max(8, Math.floor(W * 30)), Math.max(8, Math.floor(D * 30)));
  const botMat = makeDoublePageMat(botTex);
  const botGeo = new THREE.PlaneGeometry(W, pageBlockW);
  const botMesh = new THREE.Mesh(botGeo, botMat);
  botMesh.position.set(0, -H / 2, 0);
  botMesh.rotation.x = Math.PI / 2;
  group.add(botMesh);
}

// ══════════════════════════════════════════════════════════════
// 精装书
// ══════════════════════════════════════════════════════════════
function addHardcover(group, W, H, D) {
  const layout = BookModel.hardcoverLayout(W, H, D, hardcoverOptions);
  const materials = {
    front: images.cover ? makeTexMat(images.cover) : makeFlatMat(0x247c60),
    back: images.back ? makeTexMat(images.back) : makeFlatMat(0x266350),
    spine: images.spine ? makeTexMat(images.spine, { preserveDetail: true }) : makeFlatMat(0x245c49),
    edge: makeFlatMat(coverEdgeColor), hinge: makeFlatMat(hingeColor),
    pageSide: makeDoublePageMat(makePageTex(128, 512)),
    pageTop: makeDoublePageMat(makePageTexH(512, 128)),
    pageInner: makeFlatMat(0xe8e6df)
  };
  BookModel.buildHardcover(THREE, group, W, H, D, hardcoverOptions, materials);
  document.getElementById('board-effective').textContent = (layout.boardThick / W * 100).toFixed(2) + '%';
}

// ══════════════════════════════════════════════════════════════
// 构建书籍
// ══════════════════════════════════════════════════════════════
function buildBook() {
  renderRevision++;
  textureLoads = [];
  if (bookGroup) {
    scene.remove(bookGroup);
    disposeBook(bookGroup);
    bookGroup = null;
  }
  bookGroup = new THREE.Group();
  scene.add(bookGroup);

  const W = bookSize.w;
  const H = bookSize.h;
  const D = bookSize.d || W * 0.13;

  if (bookType === 'paperback') {
    addPaperbackCore(bookGroup, W, H, D);
  } else {
    addHardcover(bookGroup, W, H, D);
  }

  // 背景
  updateCamera();
  updateBackground();
  document.getElementById('preview-title').textContent = (bookType === 'hardcover' ? '精装' : '平装') + ' · ' + (imageName || '未导入封面');
}

function disposeBook(group) {
  const geometries = new Set(), materials = new Set(), textures = new Set();
  group.traverse(obj => {
    if (obj.geometry) geometries.add(obj.geometry);
    (Array.isArray(obj.material) ? obj.material : [obj.material]).filter(Boolean).forEach(mat => {
      materials.add(mat);
      if (mat.map) textures.add(mat.map);
    });
  });
  textures.forEach(t => t.dispose());
  materials.forEach(m => m.dispose());
  geometries.forEach(g => g.dispose());
}

async function waitForTextures() {
  let revision;
  do {
    revision = renderRevision;
    await Promise.all(textureLoads);
  } while (revision !== renderRevision);
  renderer.render(scene, camera);
}

function selectStep(step) {
  document.querySelectorAll('.panel-section[data-step]').forEach(el => el.hidden = el.dataset.step !== step);
  document.querySelectorAll('.step-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.step === step);
    el.setAttribute('aria-pressed', String(el.dataset.step === step));
  });
}

function fitView() {
  if (!bookGroup) return;
  bookGroup.updateMatrixWorld(true);
  const sphere = new THREE.Box3().setFromObject(bookGroup).getBoundingSphere(new THREE.Sphere());
  setCameraValues({ zoom: sphere.radius / Math.sin(THREE.MathUtils.degToRad(17.5)) * 1.12, height: 0 });
}

// ══════════════════════════════════════════════════════════════
// 背景更新
// ══════════════════════════════════════════════════════════════
function updateBackground() {
  const previewBg = document.getElementById('export-format')?.value === 'jpg' ? 'white' : bgType;
  if (previewBg === 'white') {
    scene.background = new THREE.Color(0xffffff);
    renderer.setClearColor(0xffffff, 1);
  } else if (previewBg === 'transparent') {
    scene.background = null;
    renderer.setClearColor(0x000000, 0);
  } else {
    scene.background = new THREE.Color(bgType);
    renderer.setClearColor(bgType, 1);
  }
  renderer.render(scene, camera);
}

// ══════════════════════════════════════════════════════════════
// 鼠标控制
// ══════════════════════════════════════════════════════════════
let isDragging = false, lastX = 0, lastY = 0;

function setupMouseControls() {
  const dom = renderer.domElement;

  dom.addEventListener('pointerdown', e => {
    if (exportBusy) return;
    if (e.button === 0) {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      dom.style.cursor = 'grabbing';
      dom.setPointerCapture(e.pointerId);
    }
  });

  dom.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    rotY -= dx * 0.5;
    rotX += dy * 0.5;
    rotX = Math.max(-180, Math.min(180, rotX));
    rotY = ((rotY + 180) % 360 + 360) % 360 - 180;

    // 更新滑块和显示
    updateCamera();
    syncCameraControls();
    lastX = e.clientX;
    lastY = e.clientY;
    loadedPreset = false;
    document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
  });

  dom.addEventListener('pointerup', () => {
    isDragging = false;
    dom.style.cursor = 'grab';
  });

  dom.addEventListener('pointercancel', () => {
    isDragging = false;
    dom.style.cursor = 'grab';
  });

  dom.addEventListener('wheel', e => {
    e.preventDefault();
    if (exportBusy) return;
    setCameraValues({ zoom: cameraDistance + e.deltaY * 0.015 });
  }, { passive: false });

  dom.style.cursor = 'grab';
}

// ══════════════════════════════════════════════════════════════
// 角度显示
// ══════════════════════════════════════════════════════════════
function updateAngleDisplay() {
  document.getElementById('az-display').textContent = rotX.toFixed(0) + '°';
  document.getElementById('el-display').textContent = rotY.toFixed(0) + '°';
  document.getElementById('rotZ-display').textContent = rotZ.toFixed(0) + '°';
}

function clampValue(value, min, max) {
  const n = parseFloat(value);
  if (!Number.isFinite(n)) return min;
  return Math.max(min, Math.min(max, n));
}

function syncCameraControls() {
  for (const suffix of ['slider', 'input']) {
    document.getElementById('zoom-' + suffix).max = Math.max(24, bookSize.h * 4, bookSize.d * 4, cameraDistance);
    document.getElementById('height-' + suffix).max = Math.max(6, bookSize.h, Math.abs(cameraHeight));
    document.getElementById('height-' + suffix).min = -Math.max(6, bookSize.h, Math.abs(cameraHeight));
  }
  const values = [
    ['az', rotX],
    ['el', rotY],
    ['rotZ', rotZ],
    ['zoom', cameraDistance],
    ['height', cameraHeight],
  ];
  values.forEach(([id, value]) => {
    const slider = document.getElementById(id + '-slider');
    const input = document.getElementById(id + '-input');
    if (slider) slider.value = value;
    if (input) {
      input.value = id === 'zoom' ? value.toFixed(1) : (id === 'height' ? value.toFixed(2) : value.toFixed(0));
    }
  });
  document.getElementById('az-val').textContent = rotX.toFixed(0) + '°';
  document.getElementById('el-val').textContent = rotY.toFixed(0) + '°';
  document.getElementById('rotZ-val').textContent = rotZ.toFixed(0) + '°';
  document.getElementById('zoom-val').textContent = cameraDistance.toFixed(1);
  document.getElementById('height-val').textContent = cameraHeight.toFixed(2);
  updateAngleDisplay();
}

function setCameraValues(values, keepPreset = false, exactSavedView = false) {
  if (values.az !== undefined) rotX = clampValue(values.az, -180, 180);
  if (values.el !== undefined) rotY = clampValue(values.el, -180, 180);
  if (values.rotZ !== undefined) rotZ = clampValue(values.rotZ, -180, 180);
  if (values.zoom !== undefined) cameraDistance = clampValue(values.zoom, 8, Math.max(24, bookSize.h * 4, bookSize.d * 4, cameraDistance, exactSavedView ? values.zoom : 0));
  const heightLimit = Math.max(6, bookSize.h, Math.abs(cameraHeight), exactSavedView ? Math.abs(values.height) : 0);
  if (values.height !== undefined) cameraHeight = clampValue(values.height, -heightLimit, heightLimit);
  loadedPreset = keepPreset;
  if (!keepPreset) document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
  syncCameraControls();
  updateCamera();
}

// UI 事件绑定
// ══════════════════════════════════════════════════════════════
function initUI() {
  document.querySelectorAll('.step-tab').forEach(btn => btn.addEventListener('click', () => selectStep(btn.dataset.step)));
  // 上传
  const uploadZone = document.getElementById('upload-zone');
  const fileInput = document.getElementById('file-input');

  uploadZone.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', e => {
    if (e.target.files.length > 0) handleFile(e.target.files[0]);
    fileInput.value = '';
  });

  // 裁切编辑集中在弹窗中，确认后统一更新模型。
  const modalFlapCropToggle = document.getElementById('modal-flap-crop-toggle');

  const onFlapToggle = checked => {
    flapCropEnabled = checked;
    modalFlapCropToggle.checked = checked;
    ensureCropBounds();
    updateSpineLines();
  };
  modalFlapCropToggle.addEventListener('change', e => onFlapToggle(e.target.checked));

  // 确认书脊
  document.getElementById('edit-crop-btn').addEventListener('click', () => showSpineModal(fullImageData, true));
  [['board', 'boardPercent', 0.4, 2.5], ['overhang', 'overhangPercent', 0.5, 4]].forEach(([id, key, min, max]) => {
    const apply = value => {
      const v = clampValue(value, min, max);
      hardcoverOptions[key] = v;

      document.getElementById(id + '-slider').value = v;
      document.getElementById(id + '-val').textContent = v.toFixed(1) + '%';

    };
    document.getElementById(id + '-slider').addEventListener('input', e => apply(e.target.value));
    document.getElementById(id + '-input').addEventListener('change', e => apply(e.target.value));
  });

  // 旋转和镜头控制
  [
    ['az', 'az'], ['el', 'el'], ['rotZ', 'rotZ'], ['zoom', 'zoom'], ['height', 'height'],
  ].forEach(([id, key]) => {
    const slider = document.getElementById(id + '-slider');
    const input = document.getElementById(id + '-input');
    const apply = value => {
      setCameraValues({ [key]: value });
    };
    slider.addEventListener('input', e => apply(e.target.value));
    input.addEventListener('change', e => apply(e.target.value));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') apply(e.target.value);

  // 书籍类型

      document.getElementById('board-effective-row').hidden = bookType !== 'hardcover';
      document.getElementById('type-label').textContent = bookType === 'hardcover' ? '精装书' : '平装本';
      updateScene();

  });

  // 背景
  document.querySelectorAll('.bg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      bgType = btn.dataset.bg;

    });

  setupViewPresets();

  document.getElementById('reset-btn').addEventListener('click', () => {
    applyViewPreset(document.querySelector('.preset-btn[data-id="front-spine"]'));
  });

  // 导出
  document.getElementById('export-single-btn').addEventListener('click', exportSingle);
  document.getElementById('export-all-btn').addEventListener('click', exportAll);
  document.getElementById('quick-export-btn').addEventListener('click', () => selectStep('export'));

  document.getElementById('export-format').addEventListener('change', () => {
    document.querySelectorAll('.bg-btn').forEach(btn => btn.disabled = document.getElementById('export-format').value === 'jpg');

  setupSpineModal();
  document.getElementById('spine-confirm-btn').addEventListener('click', onSpineModalConfirm);
  document.getElementById('spine-cancel-btn').addEventListener('click', cancelCrop);
  document.getElementById('crop-close-btn').addEventListener('click', cancelCrop);
  document.addEventListener('keydown', e => {
    if (!document.getElementById('spine-modal').classList.contains('open')) return;
    if (e.key === 'Escape') { e.preventDefault(); cancelCrop(); }
    if (e.key === 'Tab') {
      const elements = [...document.querySelectorAll('#spine-modal button, #spine-modal input')].filter(el => !el.disabled && el.offsetParent !== null);
      const first = elements[0], last = elements[elements.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
}

function updateSpineLines() {
  const fill = document.getElementById('spine-fill');
  const cropFillLeft = document.getElementById('crop-fill-left');
  const cropFillRight = document.getElementById('crop-fill-right');
  const leftLine = document.getElementById('spine-line-left');
  const rightLine = document.getElementById('spine-line-right');
  const cropLineLeft = document.getElementById('crop-line-left');
  const cropLineRight = document.getElementById('crop-line-right');
  const img = document.getElementById('spine-preview-img');
  const w = img.clientWidth || img.naturalWidth || 1;
  leftLine.style.left = (spineLeft / 100 * w) + 'px';
  rightLine.style.left = (spineRight / 100 * w) + 'px';
  fill.style.left = (spineLeft / 100 * w) + 'px';
  fill.style.width = ((spineRight - spineLeft) / 100 * w) + 'px';
  cropLineLeft.style.left = (cropLeft / 100 * w) + 'px';
  cropLineRight.style.left = (cropRight / 100 * w) + 'px';
  cropFillLeft.style.left = '0px';
  cropFillLeft.style.width = (cropLeft / 100 * w) + 'px';
  cropFillRight.style.left = (cropRight / 100 * w) + 'px';
  cropFillRight.style.width = ((100 - cropRight) / 100 * w) + 'px';
  [cropLineLeft, cropLineRight, cropFillLeft, cropFillRight].forEach(el => {
    el.classList.toggle('active', flapCropEnabled);
  });
  document.getElementById('spine-width-display').textContent = (spineRight - spineLeft).toFixed(1) + '%';
  document.getElementById('flap-crop-display').style.display = flapCropEnabled ? 'inline' : 'none';
  document.getElementById('flap-crop-width-display').textContent =
    (cropLeft + (100 - cropRight)).toFixed(1) + '%';
  document.getElementById('crop-left-input').value = cropLeft.toFixed(1);
  document.getElementById('crop-right-input').value = cropRight.toFixed(1);
  document.getElementById('crop-spine-left-input').value = spineLeft.toFixed(1);
  document.getElementById('crop-spine-right-input').value = spineRight.toFixed(1);
  document.querySelectorAll('.flap-field input').forEach(el => el.disabled = !flapCropEnabled);
  syncCropControls();
}

function ensureCropBounds() {
  cropLeft = Math.max(0, Math.min(spineLeft - 0.1, cropLeft));
  cropRight = Math.min(100, Math.max(spineRight + 0.1, cropRight));
}

function syncCropControls() {
  document.getElementById('spine-range-meta').textContent = spineLeft.toFixed(1) + '% – ' + spineRight.toFixed(1) + '%';
  document.getElementById('crop-meta').textContent = flapCropEnabled ? (cropLeft + 100 - cropRight).toFixed(1) + '%' : '未裁切';
  document.getElementById('modal-flap-crop-toggle').checked = flapCropEnabled;
}

function moveCropBoundary(boundary, value) {
  const pct = clampValue(value, 0, 100);
  if (boundary === 'left') spineLeft = clampValue(pct, flapCropEnabled ? cropLeft + 0.1 : 0.1, spineRight - 0.1);
  if (boundary === 'right') spineRight = clampValue(pct, spineLeft + 0.1, flapCropEnabled ? cropRight - 0.1 : 99.9);
  if (boundary === 'crop-left') cropLeft = clampValue(pct, 0, spineLeft - 0.1);
  if (boundary === 'crop-right') cropRight = clampValue(pct, spineRight + 0.1, 100);
  updateSpineLines();
}

function setupSpineModal() {
  const leftLine = document.getElementById('spine-line-left');
  const rightLine = document.getElementById('spine-line-right');
  const cropLineLeft = document.getElementById('crop-line-left');
  const cropLineRight = document.getElementById('crop-line-right');
  const img = document.getElementById('spine-preview-img');

  [[leftLine, 'left'], [rightLine, 'right'], [cropLineLeft, 'crop-left'], [cropLineRight, 'crop-right']].forEach(([line, boundary]) => {
    let dragging = false;
    line.addEventListener('pointerdown', e => {
      if (e.button !== 0 || (boundary.startsWith('crop-') && !flapCropEnabled)) return;
      e.preventDefault();
      dragging = true;
      line.setPointerCapture(e.pointerId);
    });
    line.addEventListener('pointermove', e => {
      if (!dragging) return;
      const rect = img.getBoundingClientRect();
      moveCropBoundary(boundary, (e.clientX - rect.left) / rect.width * 100);
    });
    line.addEventListener('pointerup', () => dragging = false);
    line.addEventListener('pointercancel', () => dragging = false);
  });
  [['crop-left-input', 'crop-left'], ['crop-right-input', 'crop-right'], ['crop-spine-left-input', 'left'], ['crop-spine-right-input', 'right']].forEach(([id, boundary]) => {
    document.getElementById(id).addEventListener('change', e => moveCropBoundary(boundary, e.target.value));
  });
  new ResizeObserver(updateSpineLines).observe(img);
}

// 文件处理
// ══════════════════════════════════════════════════════════════
async function handleFile(file) {
  const revision = ++fileRevision;
  try {
    if (exportBusy) return;
    if (file.type && !file.type.startsWith('image/')) throw new Error('请选择图片文件');
    setStatus('busy', '读取图片中…');
    const data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('无法读取图片'));
      reader.readAsDataURL(file);
    });
    const img = await decodeImage(data);
    if (revision !== fileRevision) return;
    if (img.width < 30 || img.height < 30) throw new Error('图片尺寸太小');
    pendingImageName = file.name;
    showSpineModal(data);
  } catch (err) { if (revision === fileRevision) reportError(err); }
}

function showSpineModal(imgData, preserve = false) {
  if (!imgData || exportBusy) return;
  if (cropSnapshot) cancelCrop();
  cropSnapshot = { spineLeft, spineRight, cropLeft, cropRight, flapCropEnabled };
  pendingImageData = imgData;
  if (preserve) pendingImageName = imageName;
  focusBeforeCrop = document.activeElement;
  const img = document.getElementById('spine-preview-img');
  const ready = () => {
    if (!preserve) {
    const spreadRatio = img.naturalWidth / img.naturalHeight;
    const spinePct = spreadRatio > 2.4 ? 6 : 8;
    spineLeft = (100 - spinePct) / 2;
    spineRight = (100 + spinePct) / 2;
    cropLeft = 0;
    cropRight = 100;
    flapCropEnabled = false;
    }
    updateSpineLines();
  };
  img.onload = ready;
  img.src = imgData;
  document.getElementById('spine-modal').classList.add('open');
  document.getElementById('spine-confirm-btn').disabled = false;
  if (img.complete && img.naturalWidth) ready();
  document.getElementById('modal-flap-crop-toggle').focus();
  setStatus('ready', '封面裁切待确认');
}

function closeCrop() {
  document.getElementById('spine-modal').classList.remove('open');
  pendingImageData = null;
  cropSnapshot = null;
  if (focusBeforeCrop?.isConnected) focusBeforeCrop.focus();
}

function cancelCrop() {
  if (document.getElementById('spine-confirm-btn').disabled) return;
  if (!cropSnapshot) return;
  ({ spineLeft, spineRight, cropLeft, cropRight, flapCropEnabled } = cropSnapshot);
  syncCropControls();
  closeCrop();
  document.getElementById('spine-preview-img').src = fullImageData || '';
  setStatus('ready', images.cover ? '已保留原封面' : '等待封面');
}

function decodeImage(data) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('图片格式不支持或文件已损坏'));
    img.src = data;
  });
}

async function applyCover(data) {
  const img = await decodeImage(data);
  splitCover(img);
  updateScene();
  await waitForTextures();
  document.getElementById('aspect-meta').textContent = (bookSize.w / bookSize.h).toFixed(3) + ' : 1';
  document.getElementById('depth-meta').textContent = (bookSize.d / bookSize.w * 100).toFixed(1) + '%';
  setStatus('ready', '预览已更新');
}

async function onSpineModalConfirm() {
  if (!pendingImageData) return;
  const btn = document.getElementById('spine-confirm-btn');
  btn.disabled = true;
  document.querySelectorAll('#spine-modal input').forEach(el => el.disabled = true);
  try {
    setStatus('busy', '正在生成预览…');
    const data = pendingImageData;
    await applyCover(data);
    fullImageData = data;
    imageName = pendingImageName;
    const img = document.getElementById('spine-preview-img');
    document.getElementById('image-meta').textContent = imageName + ' · ' + img.naturalWidth + ' × ' + img.naturalHeight + ' px';
    const thumb = document.createElement('img');
    thumb.src = data; thumb.className = 'upload-thumb'; thumb.alt = '已导入封面';
    document.getElementById('upload-thumb-wrap').replaceChildren(thumb);
    document.getElementById('spine-section').style.display = 'block';
    closeCrop();
    setExportBusy(false);
    document.getElementById('preview-title').textContent = (bookType === 'hardcover' ? '精装' : '平装') + ' · ' + imageName;
    selectStep('structure');
    fitView();
    showToast('封面已应用', 'success');
  } catch (err) { reportError(err); }
  finally {
    btn.disabled = false;
    document.querySelectorAll('#spine-modal input').forEach(el => el.disabled = false);
    updateSpineLines();
  }
}

function splitCover(img) {
  const w = img.width;
  const cropStartX = flapCropEnabled ? Math.round(cropLeft / 100 * w) : 0;
  const cropEndX = flapCropEnabled ? Math.round(cropRight / 100 * w) : w;
  const usableStartX = Math.max(0, Math.min(w - 3, cropStartX));
  const usableEndX = Math.max(usableStartX + 3, Math.min(w, cropEndX));
  const leftX = Math.max(usableStartX + 1, Math.min(usableEndX - 2, Math.round(spineLeft / 100 * w)));
  const rightX = Math.max(leftX + 1, Math.min(usableEndX - 1, Math.round(spineRight / 100 * w)));
  const spineW = Math.max(1, rightX - leftX);
  const backW = Math.max(1, leftX - usableStartX);
  const coverW = Math.max(1, usableEndX - rightX);

  images.back = getRegion(usableStartX, 0, backW, img.height, img);
  images.spine = getRegion(leftX, 0, spineW, img.height, img);
  images.cover = getRegion(rightX, 0, coverW, img.height, img);
  const sampledCover = sampleRegionEdgeColor(rightX, 0, coverW, img.height, img);
  const sampledSpine = sampleRegionEdgeColor(leftX, 0, spineW, img.height, img);
  coverEdgeColor = darkenHex(sampledCover, 0.82);
  hingeColor = darkenHex(sampledSpine || sampledCover, 0.62);

  const frontAspect = coverW / img.height;
  const baseW = 4.0;
  const spineToCover = spineW / Math.max(1, coverW);
  const depth = baseW * spineToCover;
  bookSize = {
    w: baseW,
    h: baseW / frontAspect,
    d: depth
  };
}

function getRegion(x, y, width, height, img) {
  const c = document.createElement('canvas');
  c.width = width; c.height = height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, x, y, width, height, 0, 0, width, height);
  return c.toDataURL('image/png', 1.0);
}

function loadTestCover() {
  if (exportBusy) return;

  const testCanvas = document.createElement('canvas');
  const panelW = 720, spineW2 = 120, ch = 1020;

  const ctx = testCanvas.getContext('2d');

  // 封底
  ctx.fillStyle = '#1e3a5f';
  ctx.fillRect(0, 0, panelW, ch);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px Microsoft YaHei';
  ctx.fillText('内容简介', 50, 200);
  ctx.font = '16px Microsoft YaHei';
  ctx.fillText('测试书籍的封底内容简介。', 50, 250);
  ctx.fillStyle = '#eee';
  ctx.fillText('ISBN 978-0-000-00000-0', 50, ch - 80);
  ctx.fillStyle = '#000';
  for (let i = 0; i < 120; i += 3) {
    ctx.fillRect(50 + i, ch - 160, 1 + (i % 5 === 0 ? 2 : 1), 90);
  }

  // 书脊
  ctx.fillStyle = '#1a365d';
  ctx.fillRect(panelW, 0, spineW2, ch);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 28px Microsoft YaHei';
  ctx.save();
  ctx.translate(panelW + spineW2 / 2, ch / 2);
  ctx.rotate(Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillText('测试书名 TEST BOOK', 0, 0);

  // 封面

  ctx.fillRect(panelW + spineW2, 0, panelW, ch);

  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(cw - 300, ch / 2, 180, 0, Math.PI * 2);

  ctx.fillStyle = 'rgba(255,215,0,0.1)';
  ctx.beginPath();
  ctx.arc(cw - 300, ch / 2, 160, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 36px Microsoft YaHei';
  ctx.fillText('测试书名', panelW + spineW2 + 50, 220);
  ctx.font = 'bold 20px Arial';
  ctx.fillStyle = '#c4b5fd';
  ctx.fillText('TEST BOOK TITLE', panelW + spineW2 + 50, 260);
  ctx.font = '18px Microsoft YaHei';
  ctx.fillStyle = '#ddd6fe';
  ctx.fillText('副标题文字示例', panelW + spineW2 + 50, 300);
  ctx.font = '16px Microsoft YaHei';
  ctx.fillText('作者：张三', panelW + spineW2 + 50, ch - 120);
  ctx.fillText('出版社：示例出版社', panelW + spineW2 + 50, ch - 80);

  const testDataURL = testCanvas.toDataURL('image/png');
  pendingImageName = '示例封面';
  showSpineModal(testDataURL);
}

function updateScene() {
  buildBook();
  updateCamera();
}

async function exportSingle() {
  if (exportBusy || !images.cover) return;
  const fmt = document.getElementById('export-format').value;
  const size = parseInt(document.getElementById('export-size').value);
  setExportBusy(true);
  try {
    const defaultName = `书模_${bookType === 'hardcover' ? '精装' : '平装'}_${Date.now()}.${fmt}`;
    let filePath;
    if (hasNativeDialog()) {
      const result = await book3dBridge.saveFileDialog(defaultName, fmt);
      if (!result || result.canceled) { setStatus('ready', '已取消导出'); return; }
      filePath = result.filePath;
    }
    setStatus('busy', '正在渲染高清图…');
    const dataURL = await getExportDataURL(fmt, size);
    if (filePath) {
      if (!await book3dBridge.saveImageFile(filePath, dataURL)) throw new Error('文件保存失败');
    } else downloadDataURL(dataURL, defaultName);
    setStatus('ready', filePath ? '已保存：' + filePath.split(/[\\/]/).pop() : '已发起下载：' + defaultName);
    showToast('导出完成', 'success');
  } catch (err) { reportError(err); }
  finally { setExportBusy(false); }
}

async function exportAll() {
  if (exportBusy || !images.cover || !selectedViewIds.length) return;
  const angles = allViewPresets().filter(a => selectedViewIds.includes(a.id)).map((a, i) => ({
    ...a, suffix: String(i + 1).padStart(2, '0') + '_' + BookViewPresets.safeFilename(a.name)
  }));
  if (!angles.length) return;
  setExportBusy(true);
  const fmt = document.getElementById('export-format').value;
  const size = parseInt(document.getElementById('export-size').value);
  const original = { az: rotX, el: rotY, rotZ, height: cameraHeight, zoom: cameraDistance };
  const preset = loadedPreset;
  const activePresets = [...document.querySelectorAll('.preset-btn')].map(btn => btn.classList.contains('active'));
  try {
  let outputFolder = null;
  if (hasNativeDialog()) {
    const folderResult = await book3dBridge.selectOutputFolder();
    if (!folderResult || folderResult.canceled || !folderResult.filePaths?.length) {
      setStatus('ready', '已取消批量导出');
      return;
    }
    outputFolder = folderResult.filePaths[0];
  }

  setStatus('busy', '正在批量导出…');
  const batchId = Date.now();

  for (let i = 0; i < angles.length; i++) {
    const a = angles[i];
    setCameraValues(a.view, false, a.id.startsWith('custom-'));

    const dataURL = await getExportDataURL(fmt, size);
    const ext = fmt === 'jpg' ? 'jpg' : 'png';
    const fileName = `书模_${batchId}_${a.suffix}.${ext}`;

    if (outputFolder) {
      if (!await book3dBridge.saveImageFile(outputFolder + '/' + fileName, dataURL)) throw new Error('保存失败：' + fileName);
    } else {
      downloadDataURL(dataURL, fileName);
    }

    setStatus('busy', `${a.name} 已导出 (${i + 1}/${angles.length})`);
    await sleep(100);
  }

  setStatus('ready', angles.length + (outputFolder ? '个视角已保存' : '个视角已发起下载'));
  showToast('批量导出完成', 'success');
  } catch (err) { reportError(err); }
  finally {
    setCameraValues(original, preset, true);
    document.querySelectorAll('.preset-btn').forEach((btn, i) => btn.classList.toggle('active', activePresets[i]));
    setExportBusy(false);
  }
}

async function getExportDataURL(fmt, size) {
  await waitForTextures();
  const previousRatio = renderer.getPixelRatio();
  const previousBackground = scene.background;
  const previousClear = renderer.getClearColor(new THREE.Color());
  const previousAlpha = renderer.getClearAlpha();
  try {
    renderer.setPixelRatio(1);
    renderer.setSize(size, size, false);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
    const white = fmt === 'jpg' || bgType === 'white';
    scene.background = white ? new THREE.Color(0xffffff) : null;
    renderer.setClearColor(white ? 0xffffff : 0x000000, white ? 1 : 0);
    renderer.render(scene, camera);
    return renderer.domElement.toDataURL(fmt === 'jpg' ? 'image/jpeg' : 'image/png', 0.97);
  } finally {
    renderer.setPixelRatio(previousRatio);
    scene.background = previousBackground;
    renderer.setClearColor(previousClear, previousAlpha);
    onResize();
  }
}

function hasNativeDialog() {
  return !!(window.electronAPI || window.__TAURI__?.core);
}

function getPresetView(btn) {
  if (btn.dataset.customId) return savedViews.find(a => a.id === btn.dataset.customId).view;
  const scale = Math.max(1, Math.hypot(bookSize.w, bookSize.h, bookSize.d) / Math.hypot(4, 5.66, 0.52));
  return {
    az: Number(btn.dataset.az), el: Number(btn.dataset.el), rotZ: Number(btn.dataset.z || 0),
    height: Number(btn.dataset.height || 0) * bookSize.h / 5.66,
    zoom: Number(btn.dataset.zoom || 11.5) * scale
  };
}

function setExportBusy(busy) {
  exportBusy = busy;
  document.body.classList.toggle('exporting', busy);
  if (busy) {
    exportDisabledStates.clear();
    document.querySelectorAll('#left-panel input, #left-panel select, #left-panel button, #toolbar button').forEach(el => {
      exportDisabledStates.set(el, el.disabled);
      el.disabled = true;
    });
  } else {
    exportDisabledStates.forEach((disabled, el) => el.disabled = disabled);
    exportDisabledStates.clear();
  }
  ['export-single-btn', 'export-all-btn', 'quick-export-btn'].forEach(id => document.getElementById(id).disabled = busy || !images.cover);
  document.getElementById('export-all-btn').disabled = busy || !images.cover || !selectedViewIds.length;
}

function currentView() {
  return { az: rotX, el: rotY, rotZ, zoom: cameraDistance, height: cameraHeight };
}

function builtInViewButtons() { return [...document.querySelectorAll('.preset-grid .preset-btn')]; }

function allViewPresets() {
  return builtInViewButtons().map(btn => ({ id: btn.dataset.id, name: btn.textContent.trim(), view: getPresetView(btn) })).concat(savedViews);
}

function applyViewPreset(btn) {
  if (exportBusy || !btn) return;
  const view = getPresetView(btn);
  setCameraValues(view, true, !!btn.dataset.customId);
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b === btn));
}

function viewStorageError(message) {
  const el = document.getElementById('view-storage-error');
  el.textContent = message;
  el.hidden = !message;
}

// Persist first, then replace the in-memory list so a failed write cannot lose a saved view.
function commitViewState(views, selected, rebuildLists = true) {
  if (exportBusy) return false;
  if (viewStorageBlocked) { reportError(new Error('本地视角数据无法读取，未覆盖原数据')); return false; }
  try {
    localStorage.setItem(viewStorageKey, BookViewPresets.encode({ views, selected }));
    savedViews = views;
    selectedViewIds = selected;
    viewStorageError('');
    if (rebuildLists) renderViewLists();
    else updateBatchSelection();
    return true;
  } catch (err) {
    viewStorageError('保存失败，原设置未变更：' + (err.message || String(err)));
    reportError(new Error('视角保存失败：' + (err.message || String(err))));
    return false;
  }
}

function resetViewNameEditor() {
  renamingViewId = null;
  document.getElementById('view-name').value = '';
  document.getElementById('cancel-view-edit').hidden = true;
  for (const key of ['title', 'aria-label']) document.getElementById('save-view-btn').setAttribute(key, '保存当前视角');
}

function renderViewLists() {
  const activeId = document.querySelector('.preset-btn.active')?.dataset.id;
  const list = document.getElementById('saved-view-list');
  const focused = document.activeElement;
  const focusedRow = focused?.closest('.saved-view-row');
  const focusId = focusedRow?.dataset.id;
  const focusAction = focused?.dataset.action;
  const focusIndex = savedViews.findIndex(a => a.id === focusId);
  list.replaceChildren();
  if (!savedViews.length) {
    const empty = document.createElement('div'); empty.className = 'empty-views'; empty.textContent = '暂无已保存视角'; list.appendChild(empty);
  }
  savedViews.forEach(a => {
    const row = document.createElement('div'); row.className = 'saved-view-row'; row.dataset.id = a.id;
    const apply = document.createElement('button'); apply.type = 'button'; apply.className = 'preset-btn';
    apply.dataset.id = apply.dataset.customId = a.id; apply.textContent = a.name;
    apply.classList.toggle('active', a.id === activeId); apply.addEventListener('click', () => applyViewPreset(apply)); row.appendChild(apply);
    const actions = document.createElement('div'); actions.className = 'saved-view-actions';
    for (const [action, icon, title] of [['update', 'Save', '用当前设置更新'], ['rename', 'Pencil', '重命名'], ['delete', 'Trash2', '删除视角']]) {
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn btn-secondary icon-btn'; btn.dataset.action = action;
      btn.title = title; btn.setAttribute('aria-label', title + '：' + a.name); btn.disabled = viewStorageBlocked;
      const span = document.createElement('span'); span.dataset.icon = icon; btn.appendChild(span);
      btn.addEventListener('click', () => editSavedView(a.id, action)); actions.appendChild(btn);
    }
    row.appendChild(actions);
    const summary = document.createElement('div'); summary.className = 'view-summary';
    summary.textContent = `X ${a.view.az.toFixed(1)}° · Y ${a.view.el.toFixed(1)}° · Z ${a.view.rotZ.toFixed(1)}° · 距离 ${a.view.zoom.toFixed(2)} · 高度 ${a.view.height.toFixed(2)}`;
    row.appendChild(summary); list.appendChild(row);
  });
  const batch = document.getElementById('batch-view-list'); batch.replaceChildren();
  allViewPresets().forEach(a => {
    const label = document.createElement('label'); label.className = 'batch-view-row';
    const input = document.createElement('input'); input.type = 'checkbox'; input.dataset.viewId = a.id; input.checked = selectedViewIds.includes(a.id); input.disabled = viewStorageBlocked;
    input.addEventListener('change', () => {
      const selected = input.checked ? [...selectedViewIds, a.id] : selectedViewIds.filter(id => id !== a.id);
      if (!commitViewState(savedViews, selected, false)) input.checked = selectedViewIds.includes(a.id);
    });
    const name = document.createElement('span'); name.textContent = a.name;
    const type = document.createElement('small'); type.textContent = a.id.startsWith('custom-') ? '我的' : '预设';
    label.append(input, name, type); batch.appendChild(label);
  });
  updateBatchSelection();
  document.getElementById('save-view-btn').disabled = viewStorageBlocked;
  renderIcons();
  if (focusedRow) {
    const rows = [...list.querySelectorAll('.saved-view-row')];
    const row = rows.find(el => el.dataset.id === focusId);
    const next = row?.querySelector(focusAction ? `[data-action="${focusAction}"]` : '.preset-btn')
      || rows[Math.max(0, Math.min(focusIndex, rows.length - 1))]?.querySelector('.preset-btn')
      || document.getElementById('view-name');
    next.focus();
  }
}

function updateBatchSelection() {
  document.querySelectorAll('#batch-view-list input').forEach(input => input.checked = selectedViewIds.includes(input.dataset.viewId));
  const ids = builtInViewButtons().map(btn => btn.dataset.id);
  const groups = { common: ids.slice(0, 4), recommended: ids, custom: savedViews.map(a => a.id) };
  document.querySelectorAll('[data-batch]').forEach(btn => {
    const group = groups[btn.dataset.batch];
    const active = selectedViewIds.length === group.length && group.every(id => selectedViewIds.includes(id));
    btn.classList.toggle('active', active); btn.setAttribute('aria-pressed', String(active));
    btn.disabled = viewStorageBlocked || (btn.dataset.batch === 'custom' && !savedViews.length);
  });
  document.getElementById('batch-count').textContent = selectedViewIds.length;
  document.getElementById('batch-export-label').textContent = `导出选中视角（${selectedViewIds.length}）`;
  document.getElementById('export-all-btn').disabled = exportBusy || !images.cover || !selectedViewIds.length;
}

function editSavedView(id, action) {
  if (exportBusy || viewStorageBlocked) return;
  const entry = savedViews.find(a => a.id === id);
  if (action === 'rename') {
    renamingViewId = id;
    const input = document.getElementById('view-name'); input.value = entry.name; input.focus(); input.select();
    document.getElementById('cancel-view-edit').hidden = false;
    for (const key of ['title', 'aria-label']) document.getElementById('save-view-btn').setAttribute(key, '保存名称');
  } else if (action === 'delete') {
    if (!window.confirm(`删除视角“${entry.name}”？`)) return;
    if (commitViewState(savedViews.filter(a => a.id !== id), selectedViewIds.filter(a => a !== id))) {
      if (renamingViewId === id) resetViewNameEditor();
      showToast('视角已删除');
    }
  } else if (window.confirm(`用当前相机设置覆盖“${entry.name}”？`)) {
    if (commitViewState(savedViews.map(a => a.id === id ? { ...a, view: currentView() } : a), selectedViewIds)) showToast('视角已更新', 'success');
  }
}

function setupViewPresets() {
  const builtIns = builtInViewButtons();
  selectedViewIds = builtIns.slice(0, 4).map(btn => btn.dataset.id);
  try {
    const state = BookViewPresets.decode(localStorage.getItem(viewStorageKey));
    savedViews = state.views;
    if (state.selected !== null) {
      const validIds = [...builtIns.map(btn => btn.dataset.id), ...savedViews.map(a => a.id)];
      selectedViewIds = state.selected.filter(id => validIds.includes(id));
    }
  } catch (err) {
    viewStorageBlocked = true;
    viewStorageError('无法读取已保存视角，原数据已保留：' + (err.message || String(err)));
  }
  builtIns.forEach(btn => btn.addEventListener('click', () => applyViewPreset(btn)));
  document.getElementById('cancel-view-edit').addEventListener('click', resetViewNameEditor);
  document.getElementById('view-save-form').addEventListener('submit', e => {
    e.preventDefault();
    if (exportBusy) return;
    try {
      const name = BookViewPresets.normalizeName(document.getElementById('view-name').value);
      const id = renamingViewId || 'custom-' + crypto.randomUUID();
      const views = renamingViewId ? savedViews.map(a => a.id === id ? { ...a, name } : a) : [...savedViews, { id, name, view: currentView() }];
      const selected = renamingViewId ? selectedViewIds : [...selectedViewIds, id];
      if (commitViewState(views, selected)) { resetViewNameEditor(); showToast('视角已保存', 'success'); }
    } catch (err) { reportError(err); }
  });
  document.querySelectorAll('[data-batch]').forEach(btn => btn.addEventListener('click', () => {
    const ids = builtIns.map(a => a.dataset.id);
    commitViewState(savedViews, btn.dataset.batch === 'custom' ? savedViews.map(a => a.id) : btn.dataset.batch === 'common' ? ids.slice(0, 4) : ids, false);
  }));
  renderViewLists();
}

function reportError(err) {
  const message = err?.message || String(err);
  setStatus('error', message);
  showToast(message, 'error');
}

function downloadDataURL(dataURL, filename) {
  const a = document.createElement('a');
  a.href = dataURL;
  a.download = filename;
  a.click();
}

// ══════════════════════════════════════════════════════════════
// 工具函数
// ══════════════════════════════════════════════════════════════
function setStatus(type, msg) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot ' + type;
  document.getElementById('status-text').textContent = msg;
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ══════════════════════════════════════════════════════════════
// 启动
// ══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  initThree();
  initUI();
  syncCameraControls();
  setStatus('ready', '等待封面');
});
</script>
